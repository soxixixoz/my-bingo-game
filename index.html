<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BINGO ONLINE</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #0f172a; --accent: #f472b6; --blue: #3b82f6; }
        body { background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; font-family: 'Segoe UI', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        #main-title { transition: all 0.5s ease; margin-top: 60px; font-size: 3rem; text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .ingame #main-title { font-size: 1.5rem; margin-top: 15px; opacity: 0.6; }

        #login-screen { text-align: center; margin-top: 40px; }
        input { padding: 12px; font-size: 1.1rem; border-radius: 8px; border: none; width: 200px; outline: none; }
        
        button { padding: 12px 28px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; background: var(--blue); color: white; font-weight: bold; }
        button:active { transform: scale(0.95); }
        
        #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; }
        #player-display { font-size: 1rem; color: #94a3b8; margin-top: 20px; }
        
        #status { background: rgba(30, 41, 59, 0.7); padding: 10px 25px; border-radius: 50px; border: 1px solid #334155; margin: 15px 0 25px 0; color: #fbbf24; font-weight: bold; min-width: 200px; text-align: center; }

        .grid { display: grid; grid-template-columns: repeat(5, 70px); gap: 10px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 15px; margin-top: 10px; }
        .cell { width: 70px; height: 70px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; cursor: pointer; transition: 0.3s; }
        .cell.selected { background: var(--accent); box-shadow: 0 0 15px var(--accent); animation: pop 0.3s ease; }
        
        #result-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        @media (max-width: 400px) { .grid { grid-template-columns: repeat(5, 16vw); } .cell { width: 16vw; height: 16vw; } }
    </style>
</head>
<body class="">
    <h1 id="main-title">BINGO ONLINE</h1>

    <div id="login-screen">
        <input type="text" id="name-input" placeholder="你的暱稱">
        <br><br>
        <button id="join-btn">加入房間</button>
    </div>

    <div id="game-screen">
        <div id="player-display">玩家: </div>
        <div id="status">等待人數中...</div>
        <button id="start-btn" style="margin-bottom: 30px;">開始遊戲</button>
        <div class="grid" id="bingo"></div>
    </div>

    <div id="result-overlay">
        <h1 style="color: gold; font-size: 3rem;">BINGO!</h1>
        <h2 id="winner-name" style="margin: 20px 0;">贏家</h2>
        <button id="back-lobby">回到大廳</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const state = { myName: "", myTurn: false, gameStarted: false };
        
        const dom = {
            login: document.getElementById('login-screen'),
            game: document.getElementById('game-screen'),
            overlay: document.getElementById('result-overlay'),
            status: document.getElementById('status'),
            board: document.getElementById('bingo'),
            startBtn: document.getElementById('start-btn')
        };

        // 載入快取名字
        window.onload = () => {
            const saved = localStorage.getItem('bingo-name');
            if (saved) document.getElementById('name-input').value = saved;
        };

        document.getElementById('join-btn').onclick = () => {
            state.myName = document.getElementById('name-input').value.trim();
            if (!state.myName) return alert("請輸入暱稱");
            localStorage.setItem('bingo-name', state.myName);
            socket.emit('joinGame', state.myName);
            dom.login.style.display = 'none';
            dom.game.style.display = 'flex';
            document.body.classList.add('ingame');
            document.getElementById('player-display').textContent = `玩家: ${state.myName}`;
        };

        dom.startBtn.onclick = () => socket.emit('requestStart');
        
        document.getElementById('back-lobby').onclick = () => {
            dom.overlay.style.display = 'none';
            dom.board.innerHTML = '';
            socket.emit('requestNewBoard');
        };

        socket.on('initBoard', (serverBoard) => {
            dom.board.innerHTML = '';
            serverBoard.forEach(n => {
                const div = document.createElement('div');
                div.className = 'cell';
                div.textContent = n;
                div.onclick = () => {
                    if (state.gameStarted && state.myTurn && !div.classList.contains('selected')) {
                        socket.emit('pickNumber', n);
                    }
                };
                dom.board.appendChild(div);
            });
        });

        socket.on('stateUpdate', (data) => {
            state.gameStarted = data.gameStarted;
            dom.startBtn.style.display = state.gameStarted ? 'none' : 'block';
            if (state.gameStarted) {
                state.myTurn = (data.turnId === socket.id);
                updateStatusText("等待選號...");
            } else {
                dom.status.textContent = `⏳ 等待人數: ${data.playerCount}`;
            }
        });

        socket.on('timerUpdate', (sec) => {
            if (state.gameStarted && state.myTurn) {
                dom.status.textContent = `🟢 你的回合 (${sec}s)`;
                dom.status.style.color = "#4ade80";
            } else if (state.gameStarted) {
                dom.status.textContent = `🔴 對手思考中...`;
                dom.status.style.color = "white";
            }
        });

        socket.on('updateBoard', (num) => {
            document.querySelectorAll('.cell').forEach(c => {
                if (c.textContent == num) c.classList.add('selected');
            });
        });

        socket.on('rejoinSuccess', (data) => {
            data.pickedNumbers.forEach(num => {
                document.querySelectorAll('.cell').forEach(c => {
                    if (c.textContent == num) c.classList.add('selected');
                });
            });
        });

        socket.on('gameOver', (data) => {
            dom.overlay.style.display = 'flex';
            document.getElementById('winner-name').textContent = `贏家: ${data.winnerNames.join(', ')}`;
            if (data.winnerNames.includes(state.myName)) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            }
        });

        function updateStatusText(text) { dom.status.textContent = text; }
    </script>
</body>
</html>
